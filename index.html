<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF9FCB"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Pops Confeitaria</title>
<meta name="claude:viewport-fit-sides" content="cover">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Princess+Sofia&family=Special+Elite&display=swap">
<style>
/* Layout: phone game — notebook menu screen; game screen = sticky illustrated stage + options sheet + sticky station bar (Papa's style) */
:root{
  --pink:#FF4F9A; --pink2:#FF9FCB; --pink3:#FFE3F0; --sky:#CDEBFF; --ink:#4A2340; --ink2:#8A5A7C; --gold:#E7B93E; --paper:#FFFDF8; --hl:#FFF27A; --lime:#C9FF5B;
  --fb:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --fs:'Princess Sofia','Brush Script MT',cursive;
  --ft:'Special Elite','Courier New',monospace;
  --fr:'M PLUS Rounded 1c','Nunito','Segoe UI',system-ui,sans-serif;
  --fa:Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:#FFF2F8;color:var(--ink);font-family:var(--fr);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(38% 26% at 8% 12%,rgba(186,228,255,.75),transparent 70%),
 radial-gradient(34% 26% at 94% 26%,rgba(255,243,160,.7),transparent 70%),
 radial-gradient(44% 32% at 75% 88%,rgba(214,192,255,.65),transparent 70%),
 radial-gradient(30% 22% at 15% 75%,rgba(190,255,220,.55),transparent 70%),
 repeating-linear-gradient(90deg,#FFDDEC 0 11px,#FFFFFF 11px 22px)}
.stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.stars-bg i{position:absolute;font-style:normal;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ransom{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin:0;line-height:1}
.ransom{column-gap:10px;row-gap:4px}.ransom .rw{display:inline-flex;gap:2px;padding:0;box-shadow:none;background:none}.ransom .rw span{display:inline-block;padding:3px 5px 2px;box-shadow:1px 2px 0 rgba(74,35,64,.25)}
.lb{display:inline-block;align-self:flex-start;font:700 12px var(--fa);text-transform:uppercase;letter-spacing:.6px;background:var(--hl);padding:2px 7px;transform:rotate(-1.2deg);box-shadow:1px 1px 0 rgba(74,35,64,.2)}
.mono{font-family:var(--ft)}
.script{font-family:var(--fs)}

/* ---------- caderno ---------- */
.note{position:relative;perspective:1600px;margin:6px auto 24px;max-width:440px}
.cover{position:absolute;inset:0;z-index:4;border-radius:14px 26px 26px 14px;transform-origin:left center;transition:transform .85s cubic-bezier(.6,.05,.3,1);backface-visibility:hidden;
 background:radial-gradient(120% 80% at 30% 10%,#FFC3DD,#F489B8 55%,#E06A9F);box-shadow:0 18px 40px rgba(160,40,100,.35),inset 0 0 0 3px rgba(255,255,255,.4);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 22px 28px 46px;overflow:hidden;border:0;width:100%}
.cover::before{content:"";position:absolute;inset:12px 12px 12px 36px;border:2px dashed rgba(255,255,255,.75);border-radius:10px 18px 18px 10px;pointer-events:none}
.cover.open{transform:rotateY(-168deg)}
.cover .ttl{font-size:clamp(30px,10vw,44px)}
.cover .sub{font-family:var(--fs);font-size:30px;color:#fff;text-shadow:0 2px 0 #C23A78}
.cover .tap{font:800 14px var(--fr);color:#fff;background:rgba(74,35,64,.35);padding:6px 14px;border-radius:999px;animation:tw 1.6s infinite}
.cover .stk{position:absolute;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.rings{position:absolute;left:-10px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;padding:30px 0;z-index:6;pointer-events:none}
.rings i{display:block;width:38px;height:13px;border-radius:9px;background:linear-gradient(#FFF1B8,#D9A43A 45%,#8C6418 70%,#F3D47A);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.pages{position:relative;z-index:2;min-height:min(132vw,600px);background:var(--paper);border-radius:12px 22px 22px 12px;box-shadow:0 14px 34px rgba(160,40,100,.28),inset 26px 0 0 #FCE8F1;padding:14px 14px 20px 40px;
 background-image:linear-gradient(#F3E3EC 1px,transparent 1px);background-size:100% 30px}
.tabs{display:flex;gap:4px;margin:-2px 0 12px}
.tab{flex:1;border:0;border-radius:10px 10px 4px 4px;padding:8px 4px 6px;font:800 13px var(--fr);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.tab.on{transform:translateY(-3px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pg{animation:flip .45s ease-out;transform-origin:left center}
@keyframes flip{from{transform:perspective(900px) rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
.pg h2{margin:2px 0 4px}
.pg .meta{font-family:var(--ft);font-size:13px;color:var(--ink2);text-align:center;margin:0 0 10px}
.agenda{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:52px 50px 1fr auto;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.85);border-radius:14px;padding:6px 8px;text-align:left;box-shadow:0 2px 0 #F6D3E4}
.arow .d{font:800 11px var(--fr);color:var(--ink2);text-align:center;line-height:1.1}
.arow svg{width:50px;height:50px;border-radius:50%;background:#FFE9F4;display:block}
.arow .nm{font:800 15px var(--fr);min-width:0}
.arow .nm small{display:block;font:500 12px var(--fr);color:var(--ink2)}
.arow .st{font-size:13px;color:var(--gold);white-space:nowrap}
.newtag{font:800 11px var(--fa);background:var(--lime);color:var(--ink);padding:2px 6px;transform:rotate(4deg);display:inline-block}
.resume{display:flex;align-items:center;gap:10px;background:var(--hl);border-radius:14px;padding:8px 10px;margin-bottom:10px;font-weight:800;font-size:14px}
.resume .jb{padding:8px 12px;font-size:15px;margin-left:auto}
.prof{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.polar{align-self:center;position:relative;background:#fff;padding:10px 10px 30px;box-shadow:0 6px 16px rgba(74,35,64,.2);transform:rotate(-2deg);width:min(64%,220px)}
.polar svg{display:block;width:100%;height:auto;background:linear-gradient(#D9F0FF,#FFE3F0)}
.polar::before{content:"";position:absolute;top:-10px;left:50%;width:80px;height:22px;margin-left:-40px;background:repeating-linear-gradient(45deg,rgba(255,159,203,.85) 0 6px,rgba(255,255,255,.85) 6px 12px);transform:rotate(3deg)}
.polar b{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--fs);font-size:22px;font-weight:400}
.prof .nmb{font-family:var(--fb);font-size:26px;text-align:center;color:var(--pink);margin:0;text-shadow:2px 2px 0 #fff}
.prof .tit{text-align:center;font:700 14px var(--fr);color:var(--ink2);margin:-8px 0 0}
.prof .pers{font-family:var(--ft);font-size:14px;line-height:1.5;margin:0;background:rgba(255,255,255,.7);padding:8px 10px;border-radius:8px}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px}
.ficha dt{font:700 12px var(--fa);text-transform:uppercase;letter-spacing:.5px;color:var(--ink2)}
.ficha dd{margin:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-weight:800}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #E7C3D6}
.tg{font:700 12px var(--fr);padding:2px 8px;border-radius:999px;background:#fff;border:1.5px solid #F3C6DB}
.tg.love{background:#FFE3F0;border-color:#FF9FCB}
.tg.hate{background:#EDE7F2;border-color:#C7B5D6;text-decoration:line-through;text-decoration-color:rgba(74,35,64,.4)}
.thst{display:inline-flex;align-items:center;gap:4px;font:800 12px var(--fr);background:#fff;border:2px solid #fff;border-radius:999px;padding:2px 8px 2px 3px;box-shadow:0 0 0 1.5px #F3C6DB}
.thst img{width:20px;height:20px}
.pnav{display:flex;gap:8px;align-items:center}
.pnav .jb{flex:1}
.album{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alb{border:0;background:#fff;padding:6px 6px 8px;box-shadow:0 4px 10px rgba(74,35,64,.18);display:flex;flex-direction:column;gap:3px;text-align:left}
.alb:nth-child(odd){transform:rotate(-1.5deg)} .alb:nth-child(even){transform:rotate(1.5deg)}
.alb svg{display:block;width:100%;height:auto}
.alb b{font-family:var(--fs);font-size:19px;font-weight:400;line-height:1}
.alb small{font-size:12px;color:var(--gold);font-weight:800}
.empty{font-family:var(--ft);text-align:center;color:var(--ink2);padding:30px 10px}

/* ---------- botões ---------- */
.jb{position:relative;border:2.5px solid #fff;border-radius:999px;padding:11px 18px;font:400 18px var(--fb);color:#fff;letter-spacing:.3px;
 background:linear-gradient(#FF9ACB,#FF4F9A 55%,#E8327F);box-shadow:0 4px 0 #B8296A,0 8px 16px rgba(232,50,127,.3);text-shadow:0 1px 0 rgba(0,0,0,.18);overflow:hidden}
.jb::after{content:"";position:absolute;left:10%;right:10%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.08));pointer-events:none}
.jb:active{transform:translateY(2px);box-shadow:0 2px 0 #B8296A}
.jb.blue{background:linear-gradient(#A8DDFF,#4FA8F0 55%,#2F86D6);box-shadow:0 4px 0 #2668A8,0 8px 16px rgba(47,134,214,.3)}
.jb.lime{background:linear-gradient(#E9FFAE,#A6E84A 55%,#7CC52A);color:var(--ink);text-shadow:none;box-shadow:0 4px 0 #5E9A1E}
.jb.small{padding:7px 12px;font-size:14px}
.jb:disabled{opacity:.45}
.gb{border:2px solid #F3C6DB;background:#fff;border-radius:12px;padding:7px 11px;font:800 13px var(--fr)}

/* ---------- jogo ---------- */
.stageWrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 22px rgba(160,40,100,.22);background:#EAF6FF}
#stage svg{display:block;width:100%;height:auto;max-height:46vh;margin:0 auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none}
.hud>*{pointer-events:auto}
.hbtn{display:flex;align-items:center;gap:4px;border:2px solid #fff;background:rgba(255,255,255,.88);border-radius:999px;padding:3px 10px 3px 4px;font:800 12px var(--fr);box-shadow:0 2px 6px rgba(74,35,64,.18)}
.hbtn img{width:24px;height:24px}
.hbtn svg{width:26px;height:26px;border-radius:50%;background:#FFE3F0}
.sttl{position:absolute;left:12px;bottom:6px;margin:0;font-family:var(--fs);font-weight:400;font-size:32px;color:var(--pink);pointer-events:none;
 text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 2px 0 #fff,2px 0 0 #fff,0 4px 8px rgba(74,35,64,.25)}
.ticket{position:absolute;top:44px;right:8px;width:min(270px,84%);background:#FFFEF2;padding:14px 12px 12px;box-shadow:0 8px 20px rgba(74,35,64,.3);transform:rotate(1.5deg);font-size:13px;z-index:3;
 background-image:linear-gradient(#E9E3C6 1px,transparent 1px);background-size:100% 22px;background-position:0 30px}
.ticket::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(201,255,91,.8);transform:rotate(-4deg)}
.ticket h4{margin:0 0 6px;font:400 20px var(--fs)}
.ticket ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.ticket li{display:flex;gap:6px;font-family:var(--ft);line-height:1.3}
.ticket li i{font-style:normal;width:16px;flex:0 0 16px;text-align:center;font-family:var(--fa);font-weight:700}
.ticket .tk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:var(--ink);color:#fff;font:800 14px var(--fr);padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:4}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.panel{margin-top:10px;background:rgba(255,255,255,.93);border:3px solid #fff;border-radius:22px;padding:14px 12px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 18px rgba(160,40,100,.14)}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:7px}
.ch{border:2px solid #FFD0E6;background:#fff;border-radius:999px;padding:7px 12px;font:800 14px var(--fr);display:inline-flex;align-items:center;gap:6px}
.ch.on{background:linear-gradient(#FFF0F7,#FFC9E2);border-color:var(--pink)}
.ch i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.ch svg{width:24px;height:24px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #F3C6DB,inset 0 -5px 0 rgba(0,0,0,.12);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--pink),0 0 10px rgba(255,79,154,.55),inset 0 -5px 0 rgba(0,0,0,.12)}
.sw.none{background:repeating-linear-gradient(45deg,#fff 0 5px,#F3C6DB 5px 7px)}
.sw.multi{background:conic-gradient(#F49AC1,#FFD27F,#FFF29A,#A8E6A2,#9AD0F5,#C9A7F0,#F49AC1)}
.sw.gold{background:linear-gradient(135deg,#8A6420,#F7E08A 35%,#C99A34 55%,#FFF2B0 75%,#9C7428)}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.ic{border:2px solid #FFE0EE;background:#fff;border-radius:16px;padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.ic img,.ic svg{width:44px;height:44px;object-fit:contain;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 2px 2px rgba(74,35,64,.25))}
.ic span{font:700 10.5px var(--fa);background:var(--hl);padding:1px 4px;line-height:1.2;text-align:center;max-width:100%;overflow-wrap:anywhere}
.ic.on{border-color:var(--pink);background:#FFF0F7;box-shadow:0 0 0 2px #FFC9E2}
.ic .th{width:7px;height:7px;border-radius:50%;background:var(--pink);align-self:flex-end;margin:-4px 2px -3px 0}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:42px;height:42px;border-radius:14px;border:2px solid #FFD0E6;background:#fff;font:400 22px var(--fb);color:var(--pink)}
.stp output{min-width:40px;text-align:center;font:400 26px var(--fb);color:var(--ink)}
.hint{margin:0;font-size:13px;font-weight:700;color:var(--ink2)}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 14px;font:700 16px/1.45 var(--fr);box-shadow:4px 4px 0 var(--pink2)}
.bubble::before{content:"";position:absolute;top:-16px;left:40px;border:12px solid transparent;border-bottom:14px solid var(--ink)}
.bubble::after{content:"";position:absolute;top:-10px;left:43px;border:9px solid transparent;border-bottom:11px solid #fff}
.bubble b{font-family:var(--fs);font-weight:400;font-size:22px;color:var(--pink);display:block;line-height:1}
.meter{position:relative;height:34px;border-radius:999px;background:linear-gradient(90deg,#FFF3D6,#F3C77A 40%,#C7843E 62%,#7A3E1A 82%,#2A160C);border:3px solid #fff;box-shadow:0 0 0 2px #F3C6DB;overflow:hidden}
.meter .zone{position:absolute;top:2px;bottom:2px;left:58%;width:14%;border:3px dashed #fff;border-radius:10px;background:rgba(201,255,91,.45)}
.meter .ndl{position:absolute;top:-3px;bottom:-3px;width:7px;margin-left:-3.5px;background:var(--ink);border-radius:4px;box-shadow:0 0 0 2px #fff;left:0}
.scale{display:flex;justify-content:space-between;font:700 11px var(--fa);text-transform:uppercase;color:var(--ink2)}
.res{background:var(--pink3);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.res strong{font:400 20px var(--fb);color:var(--pink)}
.subt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subt::-webkit-scrollbar{display:none}
.subt .ch{flex:0 0 auto;font-size:13px;padding:6px 11px}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:14px;background:#fff;border-radius:12px;padding:7px 10px;border:2px solid #FFE0EE}
.check li b{font-family:var(--fa);width:18px;flex:0 0 18px}
.sbar{position:sticky;bottom:0;z-index:6;margin-top:10px;padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;background:linear-gradient(rgba(255,242,248,0),#FFF2F8 28%)}
.stabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.stabs::-webkit-scrollbar{display:none}
.stb{position:relative;flex:0 0 auto;width:54px;border:2px solid #FFE0EE;background:#fff;border-radius:14px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font:800 9.5px var(--fr);color:var(--ink2)}
.stb img{width:26px;height:26px}
.stb.on{border-color:var(--pink);background:#FFF0F7;color:var(--pink);transform:translateY(-3px)}
.stb.ok::after{content:"✓";position:absolute;top:-6px;right:-4px;width:17px;height:17px;border-radius:50%;background:#7CC52A;color:#fff;font:700 11px/17px var(--fa);text-align:center;border:2px solid #fff}
.sbar .jb{flex:0 0 auto;padding:10px 14px;font-size:16px}

/* ---------- modal / festa ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(74,35,64,.4);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.card{position:relative;width:min(100%,440px);border-radius:26px;padding:18px 16px;border:5px solid transparent;
 background:linear-gradient(#FFFDF8,#FFFDF8) padding-box,conic-gradient(from 0deg,#FFB3D9,#B3E5FF,#D9FFB3,#FFF3B3,#E0C3FF,#FFB3D9) border-box;box-shadow:0 18px 40px rgba(74,35,64,.35);display:flex;flex-direction:column;gap:10px;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.card .face{display:flex;gap:10px;align-items:center}
.card .face svg{width:84px;height:84px;flex:0 0 84px;border-radius:50%;background:linear-gradient(#D9F0FF,#FFE3F0);border:3px solid #fff;box-shadow:0 0 0 2px #F3C6DB}
.card .say{font:700 15px/1.4 var(--fr);margin:0}
.bigstars{font-size:38px;letter-spacing:4px;text-align:center;color:var(--gold);text-shadow:0 2px 0 #B8862A,0 0 12px rgba(255,220,100,.8);line-height:1}
.bigstars .off{color:#EBDDE5;text-shadow:none}
.brk{display:flex;flex-direction:column;gap:6px}
.brow{background:#fff;border-radius:12px;padding:7px 10px;border:2px solid #FFE0EE;font-size:13px}
.brow .h{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.brow .h span:last-child{font-variant-numeric:tabular-nums;color:var(--pink)}
.brow p{margin:3px 0 0;color:var(--ink2);font-weight:700}
.tot{display:flex;justify-content:space-between;align-items:center;font:400 22px var(--fb);color:var(--ink);padding:4px 4px 0}
.tot small{font:800 14px var(--fr);color:var(--ink2)}
.party{position:relative;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 22px rgba(160,40,100,.25)}
.party svg{display:block;width:100%;height:auto}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;top:-16px;width:8px;height:13px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(520px) rotate(620deg)}}
.pcard{margin-top:12px;display:flex;flex-direction:column;gap:10px;align-items:stretch;background:rgba(255,255,255,.93);border:3px solid #fff;border-radius:22px;padding:14px;margin-bottom:24px}
.pcard p{margin:0;text-align:center;font-weight:700}
/* svg animações */
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flk .18s ease-in-out infinite alternate}
@keyframes flk{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
.twk{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.spinf{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.swing{transform-box:view-box;animation:swing 3s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.glow{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.15}to{opacity:.55}}
.enter{animation:enter .6s cubic-bezier(.3,1.3,.5,1)}
@keyframes enter{from{transform:translateX(260px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

let PID=0;const np=()=>'p'+(PID++)+'_';
function rng(seed){let a=(seed*2654435761)>>>0||7;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function toHex(r){return'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function shade(h,a){const c=hx(h),t=a<0?0:255,p=Math.abs(a);return toHex(c.map(v=>v+(t-v)*p))}
function mixC(a,b,t){const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))}
function lum(h){const c=hx(h);return(c[0]*.3+c[1]*.59+c[2]*.11)/255}
const IMG={};
for(const k in IMGB64){try{const bin=atob(IMGB64[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);IMG[k]=URL.createObjectURL(new Blob([u],{type:'image/webp'}))}catch(e){IMG[k]='data:image/webp;base64,'+IMGB64[k]}}

function tokens(B){const T=new Set(),add=t=>T.add(t);
 add('forma:'+B.forma);add('andares:'+B.andares);for(let k=1;k<=B.andares;k++)add('andares>='+k);
 add('sabor:'+B.sabor);add('massafam:'+massaFam(B));add('recheio:'+B.recheio);add('cob:'+B.cob);
 if(B.cob!=='nenhuma')add('cobfam:'+COL[B.cobCor].fam);
 if(B.drip){add('drip:any');add('dripfam:'+COL[B.drip].fam)}
 add('borda:'+B.borda);if(B.borda!=='nenhuma')add('bordafam:'+COL[B.bordaCor].fam);
 if(B.glitter)add('glitter');
 B.top.forEach(o=>add('item:'+o.k));for(let k=1;k<=Math.min(40,B.top.length);k++)add('top>='+k);
 const v=B.vela;if(v.t!=='nenhuma'){add('velas:any');add('vela:'+v.t);if(v.t!=='faisca')add('velafam:'+COL[v.c].fam);if(v.t==='numero')add('num:'+v.num)}
 const S=B.sal;add('parede:'+S.parede);add('pend:'+S.pend);add('flor:'+S.flor);add('svela:'+S.svela);add('mesa:'+S.mesa);add('bal:'+S.bal);if(S.globo)add('globo');
 colorFams(B).forEach(f=>add('fam:'+f));return T}
function colorFams(B){const r=[massaFam(B)];const S=B.sal;const fo=x=>x==='multi'?'multi':COL[x].fam;
 if(B.cob!=='nenhuma')r.push(COL[B.cobCor].fam);if(B.drip)r.push(COL[B.drip].fam);if(B.borda!=='nenhuma')r.push(COL[B.bordaCor].fam);if(B.vela.t!=='nenhuma'&&B.vela.t!=='faisca')r.push(COL[B.vela.c].fam);
 r.push(COL[S.parCor].fam);r.push(COL[S.mesaCor].fam);if(S.bal!=='nenhum')r.push(fo(S.balCor));if(S.band)r.push(fo(S.band));if(S.fita)r.push(fo(S.fita));return r}
function themeTags(B){const L=[];B.top.forEach(o=>{const it=ITEMS[o.k];if(it&&it.th.length)L.push({n:it.n,th:it.th})});const S=B.sal;
 if(PAREDES[S.parede].th)L.push({n:'Parede '+PAREDES[S.parede].n.toLowerCase(),th:PAREDES[S.parede].th});
 if(S.pend!=='nenhum'&&ITEMS[S.pend].th.length)L.push({n:ITEMS[S.pend].n+' pendurados',th:ITEMS[S.pend].th});
 if(S.flor!=='nenhuma'&&ITEMS[S.flor].th.length)L.push({n:'Arranjo de '+ITEMS[S.flor].n.toLowerCase(),th:ITEMS[S.flor].th});
 if(SVELAS[S.svela].th)L.push({n:SVELAS[S.svela].n,th:SVELAS[S.svela].th});
 if(SAB[B.sabor].th)L.push({n:'Massa arco-íris',th:SAB[B.sabor].th});return L}
function salaoCount(B){const S=B.sal;return[S.parede!=='lisa',S.pend!=='nenhum',!!S.band,!!S.fita,S.bal!=='nenhum',S.flor!=='nenhuma',S.svela!=='nenhuma',S.globo].filter(Boolean).length}
function scoreOf(c,B){const T=tokens(B);
 const reqs=c.req.map(r=>({txt:r.txt,ok:r.any.some(x=>T.has(x))}));const pedido=Math.round(40*reqs.filter(r=>r.ok).length/reqs.length);
 const cf=colorFams(B);let m=0;cf.forEach(f=>{if(f==='multi')m+=.25;else if(f===c.fav)m+=1;else if((NEAR[c.fav]||[]).indexOf(f)>=0)m+=.5});const ratio=cf.length?m/cf.length:0;const cor=Math.round(20*Math.min(1,ratio/.45));
 const tg=themeTags(B);let on=0,off=[];tg.forEach(o=>{if(o.th.indexOf(c.tema)>=0)on++;else off.push(o.n)});const tema=Math.max(0,Math.round(25*Math.min(1,on/5))-3*off.length);
 let cap=Math.round(8*(B.baked?B.bakeQ:0)/100);if(B.top.length>=3)cap+=3;if(salaoCount(B)>=5)cap+=4;if(B.top.length>35)cap-=3;cap=Math.max(0,cap);
 const amei=c.ama.filter(t=>T.has(t)),odiei=c.odeia.filter(t=>T.has(t));const extra=Math.min(9,amei.length*3),pen=odiei.length*8;
 const total=Math.max(0,Math.min(100,pedido+cor+tema+cap+extra-pen));const stars=total>=90?5:total>=75?4:total>=55?3:total>=35?2:1;const tip=Math.round(total/4)+stars*3;
 return{reqs,pedido,cor,ratio,tema,on,off,cap,amei,odiei,extra,pen,total,stars,tip}}
function tokLabel(t){if(t==='glitter')return'glitter';if(t==='globo')return'globo de festa';const[a,b]=t.split(':');
 switch(a){case'item':return ITEMS[b]?ITEMS[b].n:b;case'fam':return'cor '+FAMN[b];case'sabor':return'massa '+SAB[b].n.toLowerCase();case'recheio':return'recheio de '+REC[b].n.toLowerCase();case'cob':return b==='nenhuma'?'bolo sem cobertura':COB[b].n.toLowerCase();case'drip':return'calda escorrendo';case'parede':return'parede '+PAREDES[b].n.toLowerCase();case'pend':return ITEMS[b].n.toLowerCase()+' pendurados';case'flor':return'arranjo de '+ITEMS[b].n.toLowerCase();case'svela':return SVELAS[b].n.toLowerCase();case'bal':return b==='arco'?'arco de balões':'cachos de balões'}return t}
function exprFor(t){return t>=85?'joy':t>=65?'happy':t>=45?'neutral':t>=30?'sad':'angry'}
function falaFor(c,t){return c.falas[t>=85?0:t>=65?1:t>=45?2:3]}

function act(a,v){const b=B(),S=b.sal;let stageOnly=false;

 case'assar':UI.ovenRun=true;UI.oven=0;ovenStart();break;case'tirar':ovenStop();return;
 case'recheio':b.recheio=v;break;case'camadas':b.camadas=Math.max(1,Math.min(3,b.camadas+ +v));break;
 case'cob':b.cob=v;break;case'cobCor':b.cobCor=v;break;case'drip':b.drip=v||null;break;case'borda':b.borda=v;break;case'bordaCor':b.bordaCor=v;break;
 case'topCat':UI.topCat=v;if(v!=='velas'){const ks=Object.keys(ITEMS).filter(k=>ITEMS[k].c===v);if(ITEMS[UI.sel].c!==v)UI.sel=ks[0]}break;
 case'sel':UI.sel=v;toast('Agora toque no bolo!');renderPanel();return;
 case'glitter':b.glitter=!b.glitter;break;case'undo':b.top.pop();break;case'clearTop':b.top=[];break;
 case'vtipo':b.vela.t=v;break;case'vcor':b.vela.c=v;break;case'vqtd':if(b.vela.t==='numero')b.vela.num=Math.max(0,Math.min(99,b.vela.num+ +v));else b.vela.q=Math.max(1,Math.min(9,b.vela.q+ +v));break;
 case'salTab':UI.salTab=v;renderPanel();return;
 case'parede':S.parede=v;break;case'parCor':S.parCor=v;break;case'pend':S.pend=v;break;case'band':S.band=v||null;break;case'fita':S.fita=v||null;break;case'bal':S.bal=v;break;case'balCor':S.balCor=v;break;case'flor':S.flor=v;break;case'mesa':S.mesa=v;break;case'mesaCor':S.mesaCor=v;break;case'svela':S.svela=v;break;case'globo':S.globo=!S.globo;break;
 case'deliver':deliver();return}
 G.cur.done[UI.st]=true;save();renderStage();renderPanel();renderTicket();renderBar()}

function ovenStop(silent){if(!UI.ovenRun)return;UI.ovenRun=false;cancelAnimationFrame(raf);const p=Math.min(100,UI.oven),b=B();let q,sh,lab;
 if(p<58){q=Math.max(10,Math.round(100-(58-p)*2.6));sh=.3*(58-p)/58;lab=p<40?'Ficou cru por dentro':'Ficou clarinho'}else if(p<=72){q=100;sh=-.04;lab='Dourado no ponto certo!'}else{q=Math.max(5,Math.round(100-(p-72)*3.2));sh=-(.05+.45*(p-72)/28);lab=p>90?'Queimou um pouquinho':'Passou do ponto'}

 const sc=$('scrParty');sc.innerHTML=ransom('A festa!',61,30)+`<div class="party" style="margin-top:10px">${svgWrap(salaoSVG(b,P,{guests,client:{p:c.look,ex,x:236,y:196,s:.82}}),'role="img" aria-label="Festa acontecendo"')}${R.total>=35?confettiHTML():''}</div>
 <div class="pcard"><div class="bigstars">${'★'.repeat(R.stars)}<span class="off">${'★'.repeat(5-R.stars)}</span></div><p>Festa de ${c.nome} · tema ${THEMES[c.tema].n.toLowerCase()}<br><span class="mono" style="font-weight:400">Salva no álbum do caderno ✓</span></p><button class="jb" id="pBack">Voltar ao caderno</button><button class="gb" id="pAgain">Tentar este pedido de novo</button></div>`;
 $('scrGame').hidden=true;$('scrNote').hidden=true;sc.hidden=false;window.scrollTo(0,0);
 $('pBack').onclick=()=>toNote('album');$('pAgain').onclick=()=>startOrder(cid)}
function showAlbum(i){const a=G.album[i],c=CBY[a.cid];const P=np();const guests=crowdFor(c,i*7+3);
 $('modal').innerHTML=`<div class="modal" id="mClose"><div class="card">${ransom(c.nome,i+70,20)}<div class="party">${svgWrap(salaoSVG(a.B,P,{guests,client:{p:c.look,ex:exprFor(a.total),x:236,y:196,s:.82}}),'role="img" aria-label="Festa salva"')}</div><div class="bigstars">${'★'.repeat(a.stars)}<span class="off">${'★'.repeat(5-a.stars)}</span></div><p style="text-align:center;margin:0;font-weight:800">${a.total} pontos · ${new Date(a.d).toLocaleDateString('pt-BR')}</p><button class="jb blue" id="mX">Fechar</button></div></div>`;
 $('mX').onclick=()=>{$('modal').innerHTML=''}}

gdefs();
try{renderNote()}catch(err){$('scrNote').innerHTML='<p class="empty">Não consegui abrir o caderno. <button class="jb" onclick="localStorage.removeItem(\'popsConfeitaria\');location.reload()">Recomeçar</button></p>';console.error(err)}
